<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: file: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: http: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: 'Segoe UI', system-ui, sans-serif; background: #11151c; color: #dbe5f0; }
  header { padding: 12px 18px; background: #0c1016; border-bottom: 1px solid #1e2733; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header .sub { color: #6f8298; font-size: 13px; }
  .main { flex: 1; display: flex; min-height: 0; }
  .col { padding: 14px; overflow: auto; }
  /* Sidebar: header, filter, and add controls stay fixed; only the page list scrolls */
  .grids { width: 240px; flex: none; display: flex; flex-direction: column; overflow: hidden; background: #0d1219; }
  .grids .pagelists { flex: 1 1 auto; min-height: 0; overflow: auto; margin-top: 8px; }
  #pageFilter { background: #0a111a; font-size: 13px; padding: 6px 9px; }
  /* page-type filter: pulldown of type checkboxes under the search box */
  .kindwrap { position: relative; margin-top: 6px; }
  .kindwrap { display: flex; gap: 6px; }
  .kindwrap #pageKindsBtn, .kindwrap #pageFilterReset { font-size: 12px; padding: 4px 9px; color: #9fb3c8; }
  .kindwrap #pageFilterReset:disabled { opacity: .45; }
  .kindwrap #pageKindsBtn.filtered { color: #4ea3ff; border-color: #2b6fb0; }
  .kindwrap .caret { font-size: 10px; }
  .kindwrap .diMenu { left: 0; right: auto; top: 30px; min-width: 160px; }
  .kfopt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 5px; font-size: 13px; color: #cfe0f2; cursor: pointer; }
  .kfopt:hover { background: #243246; }
  .kfopt input { width: auto; }
  .addwrap { position: relative; }
  .addwrap .diMenu { left: 0; right: auto; top: auto; bottom: 38px; min-width: 180px; }
  .colsplit { flex: none; width: 6px; cursor: col-resize; background: #1e2733; position: relative; }
  .colsplit:hover, .colsplit.dragging { background: #2b6fb0; }
  .editor { flex: 1; min-width: 0; }
  .sectitle { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #6f8298; margin: 0 0 8px; }
  .gridrow { padding: 9px 11px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 2px; border: 1px solid transparent; }
  .gridrow .gtop { display: flex; justify-content: flex-start; align-items: center; gap: 8px; min-width: 0; }
  .gridrow:hover { background: #182230; }
  .gridrow.active { background: #16314f; border-color: #2b6fb0; }
  .gridrow .badge { font-size: 11px; color: #7e93ab; flex: none; }
  .gridrow .gsub { padding-left: 28px; }
  .gridrow.dragover { border-color: #4ea3ff; box-shadow: 0 0 0 2px #4ea3ff; }
  .gridrow .griphandle { cursor: grab; opacity: .35; user-select: none; flex: none; }
  .gridrow:hover .griphandle { opacity: 1; color: #dbe5f0; }
  /* page-type chip: one icon system for Grid / Dashboard / App rows */
  .gridrow .ptype { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #9fc2ea; background: #1a2740; border: 1px solid #2b3f5e; flex: none; }
  /* labeled state badge (hidden pages, trusted apps, etc.) */
  .stbadge { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #8aa0b6; background: #182230; border: 1px solid #2a3a4e; border-radius: 4px; padding: 1px 5px; flex: none; }
  button { background: #1c2735; color: #dbe5f0; border: 1px solid #2a3a4e; border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #243246; }
  button.primary { background: #1e6fd0; border-color: #2b8bff; }
  button.primary:disabled { background: #18222e; border-color: #243246; color: #5b6b7e; cursor: default; }
  button.danger { background: #6a1e2a; border-color: #a3354a; }
  /* underline-style tabs (settings sections, dashboard Dashboard/Buttons) */
  .tabbar { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #2a3a4e; margin-bottom: 12px; }
  button.tab { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0;
    color: #8aa0b6; padding: 8px 14px; margin-bottom: -1px; font-weight: 500; }
  button.tab:hover { background: transparent; color: #dbe5f0; }
  button.tab.on { color: #ffffff; border-bottom-color: #2b8bff; }
  /* Sidebar mode switch: segmented control, distinct from content tabs. Three segments must fit
     one row even at the 180px minimum sidebar width. */
  .grids .tabbar { flex-wrap: nowrap; gap: 2px; background: #0e141c; border: 1px solid #1e2733; border-bottom: 1px solid #1e2733; border-radius: 8px; padding: 3px; }
  .grids .tabbar .tab { flex: 1; min-width: 0; padding: 6px 4px; margin-bottom: 0; border-bottom: none; border-radius: 6px; text-align: center; }
  .grids .tabbar .tab.on { background: #16314f; border-bottom: none; }
  /* Settings: vertical grouped nav + content column; sections separated by rules */
  .setwrap { display: flex; gap: 22px; align-items: flex-start; }
  .setnav { width: 170px; flex: none; position: sticky; top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .setnav .setgroup { margin: 16px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6f8298; }
  .setnav .setgroup:first-child { margin-top: 0; }
  .setnav .setitem { background: transparent; border: none; border-radius: 7px; text-align: left; padding: 7px 10px; color: #8aa0b6; font-size: 13px; }
  .setnav .setitem:hover { background: #182230; color: #dbe5f0; }
  .setnav .setitem.on { background: #16314f; color: #fff; }
  .setbody { flex: 1; min-width: 0; }
  .setbody .settitle { font-size: 20px; font-weight: 700; margin: 0 0 2px; color: #dbe5f0; }
  .setbody .setdesc { color: #8aa0b6; font-size: 13px; margin: 0 0 14px; }
  .setbody .setdesc + .sectitle, .setbody .settitle + .sectitle { border-top: 0; padding-top: 4px; margin-top: 10px; }
  .setbody .sectitle { margin: 28px 0 10px; padding-top: 18px; border-top: 1px solid #1e2733; }
  .setbody .sectitle:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  input, select, textarea { background: #0a111a; color: #dbe5f0; border: 1px solid #2a3a4e; border-radius: 6px; padding: 7px 9px; font-size: 14px; width: 100%; }
  textarea { font-family: inherit; resize: vertical; }
  /* hotkey input with an inline clear icon (button keeps its original id for the existing wiring) */
  .hkwrap { position: relative; display: inline-flex; width: 200px; flex: none; }
  .hkwrap input { width: 100%; padding-right: 26px; }
  .hkwrap .inclear { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; padding: 0; line-height: 1; font-size: 11px; background: transparent; border: none; color: #8aa0b6; border-radius: 4px; }
  .hkwrap .inclear:hover { background: #243246; color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row label { width: 110px; color: #91a4ba; font-size: 14px; flex: none; }
  .officeShortcutHead, .officeShortcutRow { display: grid; grid-template-columns: minmax(220px,.8fr) minmax(180px,1fr) minmax(220px,1.15fr) auto; gap: 12px; align-items: center; }
  .officeShortcutHead { margin: 10px 0 4px; padding: 0 4px; color: #6f8298; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .officeShortcutRow { margin: 8px 0; }
  .officeShortcutIconGroup { display: grid; grid-template-columns: 80px minmax(88px,1fr) 32px; gap: 8px; min-width: 0; }
  .officeShortcutIcon { width: 80px; font: 20px "Segoe UI Emoji"; text-align: center; }
  .officeShortcutImage { display: grid; min-width: 0; height: 38px; padding: 4px 8px; place-items: center; overflow: hidden; }
  .officeShortcutImage img { width: 28px; height: 28px; object-fit: contain; }
  .officeShortcutImageClear { width: 32px; padding: 0; }
  .officeShortcutLabel, .officeShortcutKeys { min-width: 0; }
  .officeShortcutClear { white-space: nowrap; }
  @media (max-width: 760px) {
    .officeShortcutHead { display: none; }
    .officeShortcutRow { grid-template-columns: minmax(220px,1fr) minmax(180px,1fr) auto; }
    .officeShortcutIconGroup { grid-column: 1; }
    .officeShortcutLabel { grid-column: 2 / 4; grid-row: 1; }
    .officeShortcutKeys { grid-column: 1 / 3; grid-row: 2; }
    .officeShortcutClear { grid-column: 3; grid-row: 2; }
  }
  .secretwrap { display: flex; gap: 6px; align-items: stretch; flex: 1; min-width: 0; }
  .secretwrap input { flex: 1; min-width: 0; width: auto; }
  .reveal { flex: none; width: 34px; padding: 0; font-size: 14px; line-height: 1; }
  .tilegrid { display: grid; gap: 8px; margin: 10px 0 12px; }
  .cell { border-radius: 12px; background: #141d29; border: 1px solid #233246; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bcd; overflow: hidden; }
  .cell:hover { border-color: #2b6fb0; }
  .cell.empty { background: #0d141d; border-style: dashed; color: #3a4a5e; }
  .cell.sel { border-color: #4ea3ff; box-shadow: 0 0 0 2px rgba(78,163,255,.45); }
  .cell.insel { background: #1b4a7a !important; border-color: #4ea3ff; box-shadow: inset 0 0 0 3px #4ea3ff; }
  .cell .ic { font-size: 30px; line-height: 1; } .cell .lb { font-size: 12px; margin-top: 4px; color: #91a4ba; }
  .cell.span .ic { font-size: 48px; } .cell.span .cimg { width: 52px; height: 52px; }
  .cell .cimg { width: 34px; height: 34px; object-fit: contain; }
  .cell.dragover { border-color: #4ea3ff; box-shadow: 0 0 0 2px #4ea3ff; }
  .cell img { pointer-events: none; -webkit-user-drag: none; }
  .mergebar { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; min-height: 20px; }
  .mergebar.active { background: #13243a; border: 1px solid #2b6fb0; border-radius: 8px; padding: 10px 14px; }
  .mergebar .hint { margin: 0; }
  .mergebar b { color: #cfe0f2; }
  .panes { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .form { background: #0e141c; border: 1px solid #1e2733; border-radius: 10px; padding: 14px; flex: 1; min-width: 360px; max-width: 460px; }
  .iconbox { background: #0e141c; border: 1px solid #1e2733; border-radius: 10px; padding: 14px; width: 320px; flex: none; }
  .iconopt { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; font-size: 14px; color: #cfe0f2; }
  .iconopt input { width: auto; }
  .iconopt.disabled { opacity: .45; cursor: default; }
  .iconopt .note { color: #8aa0b6; font-size: 13px; }
  .icondetail { margin: 6px 0 0 26px; min-height: 8px; }
  .icondetail .row { margin: 4px 0; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow-y: auto;
    margin-top: 8px; background: #0a111a; border: 1px solid #1b2838; border-radius: 8px; padding: 8px; }
  .emoji-btn { font-size: 19px; line-height: 1; padding: 6px; width: auto; background: #1c2735; border: 1px solid #2a3a4e; border-radius: 6px; cursor: pointer; }
  .emoji-btn:hover { background: #243246; border-color: #3a5068; }
  .iconpreview { margin-top: 14px; height: 84px; display: flex; align-items: center; justify-content: center;
    background: #0a111a; border: 1px solid #1b2838; border-radius: 10px; }
  .iconpreview .em { font-size: 52px; line-height: 1; }
  .iconpreview img { width: 64px; height: 64px; object-fit: contain; }
  .iconpreview .none { color: #41566b; font-size: 13px; }
  .dangerzone { margin-top: 26px; padding-top: 12px; border-top: 1px solid #472531; }
  .dangerzone .dzlabel { color: #e88; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; }
  /* app-form section divider (LucidType etc.) */
  .formsec { border-top: 1px solid #1a2431; padding-top: 14px; }
  .emptystate { text-align: center; color: #6f8298; border: 1px dashed #233246; border-radius: 10px; padding: 28px 16px; font-size: 13.5px; max-width: 460px; }
  .emptystate .big { color: #cfe0f2; font-size: 15px; margin-bottom: 6px; }
  :focus-visible { outline: 2px solid #4ea3ff; outline-offset: 1px; }
  .warn { color: #e8b04b; }
  /* status pill for section headers (device / integration state) */
  .stpill { display: inline-block; font-size: 10px; text-transform: none; letter-spacing: .3px; border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: middle; border: 1px solid; }
  .stpill.ok { color: #7fb59a; border-color: #2f5d44; background: #12271c; }
  .stpill.off { color: #8aa0b6; border-color: #2a3a4e; background: #182230; }
  .stpill.err { color: #e88; border-color: #6a2f3a; background: #2a161c; }
  /* knob-action matrix as a bordered table */
  .knobtbl { display: grid; grid-template-columns: 110px 1fr 1fr 1fr; border: 1px solid #233246; border-radius: 8px; overflow: hidden; margin-top: 6px; max-width: 780px; }
  .knobtbl > * { padding: 8px 10px; border-bottom: 1px solid #1a2431; display: flex; align-items: center; }
  .knobtbl .kth { background: #0e141c; color: #6f8298; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .knobtbl > :nth-last-child(-n+4) { border-bottom: none; }
  .knobtbl label { width: auto; color: #91a4ba; font-size: 13.5px; }
  /* integration cards (Auth page) */
  .card { background: #0e141c; border: 1px solid #1e2733; border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
  .setbody .card .sectitle { border-top: 0; padding-top: 0; margin-top: 0; }
  /* sortable table headers (Drop-in apps) */
  .diTbl th .diThSort { background: transparent; border: none; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
  .diTbl th .diThSort:hover { color: #cfe0f2; }
  /* live page preview: the real 1920x480 panel page scaled into a 640x160 box; the native button
     strip is composited on the stage with the panel's own geometry and tile styling (index.html) */
  .apprev { width: 640px; max-width: 100%; aspect-ratio: 4 / 1; border: 1px solid #233246; border-radius: 10px; overflow: hidden; background: #0a111a; position: relative; }
  .apprev .apprevStage { position: absolute; top: 0; left: 0; width: 1920px; height: 480px; transform: scale(0.3333); transform-origin: top left;
    background: radial-gradient(140% 200% at 0% 0%, #0e1b2e 0%, #05080d 70%); }
  .apprev .apprevFrame { position: absolute; top: 0; left: 0; width: 1920px; height: 480px; border: 0; pointer-events: none; }
  .apprev .apprevStrip { position: absolute; top: 0; height: 480px; display: grid; gap: 10px; padding: 12px; box-sizing: border-box;
    background: radial-gradient(140% 200% at 0% 0%, #0e1b2e 0%, #05080d 70%); }
  .apprev .ptile { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 18px;
    background: linear-gradient(160deg, #18293d, #0c141f); border: 1px solid #243a55; color: #cfe0f2; }
  .apprev .ptile.empty { background: #0a111a; border: 1px dashed #1b2838; }
  .apprev .ptile .em, .apprev .ptile .ic { font-size: 60px; line-height: 1; }
  .apprev .ptile img { width: 64px; height: 64px; object-fit: contain; }
  .apprev .ptile .lb { font-size: 20px; margin-top: 8px; color: #9fb3c8; }
  /* interactive management surface for served drop-ins that declare manifest.editor.
     The iframe remains a sandboxed loopback page: no preload, Node, or raw IPC exposure. */
  .appmanage { width: 100%; max-width: 1100px; height: min(680px, calc(100vh - 220px)); min-height: 500px;
    border: 1px solid #233246; border-radius: 10px; overflow: hidden; background: #0a111a; }
  .appmanageFrame { display: block; width: 100%; height: 100%; border: 0; background: #0a111a; }
  /* Apps page: one bounded app-management surface — toolbar, list header, two-column row list */
  .amgr { max-width: 900px; }
  .amgr .amnote { color: #8aa0b6; font-size: 13px; margin: -8px 0 16px; }
  .ambar { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .ambar input[type=search] { width: 300px; }
  .ambar .amcount { color: #8aa0b6; font-size: 13px; white-space: nowrap; }
  .amhead { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .amhead .amlabel { color: #7f93a8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .amhead .ambulk { margin-left: auto; display: flex; gap: 8px; }
  /* columns: 2 up to a 380px minimum column width — collapses to 1 on its own when the surface narrows */
  .alist { background: #0e141c; border: 1px solid #1e2733; border-radius: 10px; padding: 4px 0; columns: 2 380px; column-gap: 0; }
  .arow { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid #16202c; break-inside: avoid; }
  .arow:hover { background: #121a25; }
  .abadge { width: 30px; height: 30px; border-radius: 8px; background: #1c2735; border: 1px solid #2a3a4e; flex: none;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #9fc1e8; }
  .ameta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .ameta .amname { font-size: 14px; color: #dbe5f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ameta .amdesc { font-size: 12px; color: #8aa0b6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aswitch { margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: pointer; flex: none; }
  .aswitch .swstate { font-size: 12px; color: #8aa0b6; width: 42px; text-align: right; }
  .aswitch input:checked ~ .swstate, .aswitch input:checked + .swtrack + .swstate { color: #cfe0f2; }
  .aswitch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .swtrack { width: 36px; height: 20px; border-radius: 10px; background: #2a3a4e; position: relative; flex: none; transition: background .15s; }
  .swtrack::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #8aa0b6; transition: left .15s, background .15s; }
  .aswitch input:checked + .swtrack { background: #2b6fb0; }
  .aswitch input:checked + .swtrack::after { left: 18px; background: #e8f1fa; }
  .aswitch input:focus-visible + .swtrack { outline: 2px solid #4ea3ff; outline-offset: 2px; }
  .amempty { display: none; color: #8aa0b6; font-size: 13px; padding: 14px 16px; }
  .amlink { margin: 14px 0 0; font-size: 13px; color: #8aa0b6; }
  .amlink a { color: #4ea3ff; cursor: pointer; text-decoration: none; }
  .amlink a:hover, .amlink a:focus-visible { text-decoration: underline; }
  /* Theme live preview + preset chips */
  .thprev { display: flex; gap: 16px; align-items: center; border: 1px solid #233246; border-radius: 10px; padding: 16px; max-width: 460px; }
  .thprev .thtile { width: 64px; height: 64px; border-radius: 12px; border: 1px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .thprev .thtile span:last-child { font-size: 11px; }
  .thprev .thclock { font: 700 30px Consolas, monospace; }
  .presetwrap { position: relative; display: inline-flex; }
  .presetwrap .px { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; padding: 0; font-size: 9px; line-height: 1; border-radius: 50%; background: #243246; border: 1px solid #3a5068; color: #cfe0f2; display: none; }
  .presetwrap:hover .px, .presetwrap:focus-within .px { display: block; }
  .presetwrap button.pc.on { outline: 2px solid #4ea3ff; outline-offset: 1px; }
  .hint { color: #8aa0b6; font-size: 13px; line-height: 1.55; max-width: 78ch; margin-top: 8px; }
  /* long help collapses to its first sentence; native <details>, no JS */
  details.hint summary { cursor: pointer; display: inline; list-style: none; }
  details.hint summary::-webkit-details-marker { display: none; }
  details.hint summary::after { content: " More…"; color: #4ea3ff; white-space: nowrap; }
  details.hint[open] summary::after { content: " Less"; }
  /* Routines tab: searchable master-detail. Left = compact scannable list + search; right = the one
     selected routine's fields. Stacks on a narrow window. */
  .rtSplit { display: flex; gap: 16px; align-items: flex-start; }
  .rtList { width: 300px; flex: none; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .rtListHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rtCount { color: #6f8298; font-size: 12px; }
  .rtItems { display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow: auto; padding-right: 2px; }
  .rtItem { padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; min-width: 0; }
  .rtItem:hover { background: #182230; }
  .rtItem.sel { background: #16314f; border-color: #2b6fb0; }
  .rtItem .rtiName { font-size: 13px; font-weight: 600; color: #dbe5f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rtItem .rtiSub { font-size: 11px; color: #6f8298; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .rtItem .rtiPage { color: #8aa0b6; }
  .rtDetail { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .rtDetailHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rtHeadBtns { display: flex; gap: 8px; flex: none; }
  button.rtRun { background: #1e6fd0; border-color: #2b8bff; color: #fff; }

  .rtField { display: flex; flex-direction: column; gap: 4px; }

  .rtEmpty { color: #6f8298; font-size: 13px; padding: 18px 4px; line-height: 1.5; }
  /* Stack when the routines pane itself is narrow -- a container query, not a viewport one, because

  #sRoutineRows { container-type: inline-size; }
  @container (max-width: 680px) {
    .rtSplit { flex-direction: column; }
    .rtList { width: 100%; }

  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 26px; }
  .chip { display: flex; align-items: center; gap: 6px; background: #182230; border: 1px solid #2a3a4e; border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13px; color: #cfe0f2; }

  /* Drop-In Apps management table */

  .diTbl { width: 100%; border-collapse: collapse; }

  .diVer { color: #91a4ba; font-variant-numeric: tabular-nums; }

  .diOk { color: #6f8298; } .diOk .diDot { background: #3f7d5a; }
  .diUpd { color: #e8b04b; font-variant-numeric: tabular-nums; } .diUpd .diDot { background: #e8b04b; }
  .diErr { color: #c98; } .diErr .diDot { background: #8a5a2a; }
  .diNone { color: #41566b; }
  button.diUp { background: #1e6fd0; border-color: #2b8bff; color: #fff; padding: 4px 10px; font-size: 12px; margin-left: 8px; }
  button.diUp:hover { background: #2b7ee0; }
  .diKebab { position: relative; text-align: right; }
  button.diKb { background: transparent; border: 1px solid transparent; color: #91a4ba; font-size: 18px; line-height: 1; padding: 2px 8px; }
  .diTbl tbody tr:hover button.diKb { border-color: #2a3a4e; }
  .diMenu { display: none; position: absolute; right: 6px; top: 34px; z-index: 50; background: #141d29; border: 1px solid #2a3a4e; border-radius: 8px; padding: 4px; min-width: 148px; box-shadow: 0 8px 24px rgba(0,0,0,.5); text-align: left; }
  .diMenu.open { display: block; }
  .diMenu button { display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 7px 10px; border-radius: 5px; font-size: 13px; }
  .diMenu button:hover { background: #243246; }
  /* executable-code trust prompt: in-editor modal (3 answers; native confirm only offers 2) */
  .diTrustOv { position: fixed; inset: 0; z-index: 200; background: rgba(4,8,14,.6); display: flex; align-items: center; justify-content: center; }
  .diTrustBox { background: #141d29; border: 1px solid #2a3a4e; border-radius: 10px; padding: 18px; max-width: 520px; margin: 20px;
    box-shadow: 0 12px 36px rgba(0,0,0,.55); font-size: 14px; color: #dbe5f0; line-height: 1.5; }
  .diMenu button:disabled { color: #5b6b7e; cursor: default; }
  .diMenu button.del { color: #e88; }
  .diMSep { height: 1px; background: #1e2733; margin: 3px 2px; }
  .diSrcRow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .diSrcLab { color: #6f8298; width: 22px; text-align: right; flex: none; font-size: 12px; }
  .diSrcRow input { flex: 1; background: #0a111a; }
  /* sub-tabs + panes */
  .diSubbar { display: flex; gap: 2px; border-bottom: 1px solid #1e2733; margin: 14px 0 16px; flex-wrap: wrap; }
  .diSubtab { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: #8aa0b6; padding: 9px 16px; font-weight: 500; margin-bottom: -1px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .diSubtab:hover { color: #dbe5f0; background: transparent; }
  .diSubtab.on { color: #ffffff; border-bottom-color: #2b8bff; }
  .diSubBadge { font-size: 11px; background: #243449; color: #bcd4ee; border-radius: 999px; padding: 1px 8px; line-height: 1.5; }
  .diSubtab.on .diSubBadge { background: #1e6fd0; color: #fff; }
  .diSubBadge.amber { background: #4a3410; color: #e8b04b; }
  .diReady { color: #7fb59a; } .diReady .diDot { background: #3f7d5a; }
  .diFilterWrap { position: relative; }
  .diFmenu { display: none; position: absolute; right: 0; top: 38px; z-index: 20; background: #141d29; border: 1px solid #2a3a4e; border-radius: 9px; padding: 8px 12px; min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .diFmenu.open { display: block; }
  .diFh { color: #6f8298; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin: 6px 0 4px; }
  .diFmenu label { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: #cfe0f2; cursor: pointer; }
  .diFmenu label input { width: auto; }
  .diFchip { display: inline-flex; align-items: center; gap: 6px; background: #16314f; border: 1px solid #2b6fb0; color: #dbe9ff; border-radius: 999px; padding: 3px 6px 3px 11px; font-size: 12px; margin-right: 6px; }
  .diFchip .x { cursor: pointer; color: #9fc2ea; font-size: 14px; line-height: 1; }
  .diPills { display: flex; gap: 7px; }
  .diPill { background: #141d29; border: 1px solid #2a3a4e; border-radius: 999px; padding: 5px 12px; font-size: 12px; color: #91a4ba; cursor: pointer; user-select: none; }
  .diPill.on { background: #16314f; border-color: #2b6fb0; color: #fff; }
  .diPill .n { color: #6f8298; font-size: 11px; } .diPill.on .n { color: #bcd4ee; }
  .diCatRow { display: flex; align-items: flex-start; gap: 12px; padding: 11px 4px; border-bottom: 1px solid #141c27; }
  .diCatRow .body { flex: 1; min-width: 0; }   /* min-width:0 lets the description ellipsize instead of shoving the Install button off-screen */
  .diCatRow > button { flex: none; width: 104px; text-align: center; }   /* uniform centered action column — mixed widths right-anchored looked ragged */
  .diCatNm { font-weight: 600; color: #dbe5f0; font-size: 13.5px; }
  .diCatNm .v { color: #6f8298; font-weight: 400; font-size: 12px; margin-left: 6px; }
  .diCatDs { color: #6f8298; font-size: 12px; margin-top: 3px; line-height: 1.45; }
  .diCatRow .diRepoPill { margin-top: 4px; }
  .diEmpty { text-align: center; color: #6f8298; padding: 34px 10px; font-size: 13.5px; }
  .diEmpty .big { font-size: 15px; color: #cfe0f2; margin-bottom: 6px; }
  .diEmpty .chk { color: #3f7d5a; font-size: 26px; margin-bottom: 10px; }
  /* named-source + discover-tile additions */
  .diSrcName { display: inline-block; font-size: 12px; color: #bcd4ee; background: #13243a; border: 1px solid #274a72; border-radius: 5px; padding: 2px 8px; }
  .diSrcName.priv { color: #d9c7f0; background: #241a33; border-color: #4a3a6a; }
  .diTile { width: 38px; height: 38px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #cfe0f2; background: #1a2740; border: 1px solid #2b3f5e; }
  .diCatRow { align-items: center; }
  .diCatDs { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .diCatMeta { color: #6f8298; font-size: 11.5px; margin-top: 3px; }
  .diSrcTable { width: 100%; border-collapse: collapse; }
  .diSrcTable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #6f8298; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #1e2733; }
  .diSrcTable td { padding: 9px 8px; vertical-align: top; }
  .diSrcTable input { width: 100%; background: #0a111a; }
  .diNameInput { max-width: 180px; }
  .diNameErr { color: #e88; font-size: 11.5px; margin-top: 3px; }
  .diIdMeta { color: #41566b; font-size: 11px; margin-left: 6px; }

<body>
  <header>
    <h1>Bedrock Panel Editor <span id="appVer" style="font-size:13px; font-weight:400; opacity:.6"></span></h1>
    <span class="sub">edit, then Save &amp; apply to push to the panel</span>
    <span style="flex:1"></span>
    <button id="settingsBtn">⚙ Settings</button>
  </header>
  <div class="main">
    <div class="col grids">
      <div class="tabbar" style="margin-bottom:10px">
        <button id="lTabPages" class="tab on">Pages</button>
        <button id="lTabGroups" class="tab">Groups</button>
        <button id="lTabPanes" class="tab">Panes</button>
      </div>
      <input id="pageFilter" type="search" placeholder="Search pages…">
      <div class="kindwrap">
        <button id="pageKindsBtn" aria-haspopup="true" aria-expanded="false">Filter <span class="caret">▾</span></button>
        <button id="pageFilterReset" title="Clear the search and show all page types" disabled>Reset</button>
        <div id="pageKindsMenu" class="diMenu">
          <label class="kfopt"><input type="checkbox" data-kind="grid" checked> Grids</label>
          <label class="kfopt"><input type="checkbox" data-kind="appBuiltin" checked> Built-in apps</label>
          <label class="kfopt"><input type="checkbox" data-kind="appDropin" checked> Drop-in apps</label>
          <label class="kfopt"><input type="checkbox" data-kind="web" checked> Dashboards</label>
        </div>
      </div>
      <div class="pagelists">
        <div id="gridlist"></div>
        <div id="grouplist" style="display:none"></div>
        <div id="panelist" style="display:none"></div>
      </div>
      <div id="addPageBtns" class="row addwrap" style="margin-top:12px; gap:6px">
        <button class="primary" id="addPageMenuBtn">+ Add page</button>
        <div id="addPageMenu" class="diMenu">
          <button id="addGrid">▦&nbsp; Grid page</button>
          <button id="addDash">◱&nbsp; Dashboard page</button>
          <button id="addApp">▣&nbsp; App page</button>
          <button id="addStarter" title="The bundled starter tile pages for this computer (Default, Media, Dev) — the same pages a fresh install starts with">★&nbsp; Starter pages…</button>
        </div>
      </div>
      <div id="addGroupBtns" class="row" style="margin-top:12px; gap:6px; display:none"><button class="primary" id="addGroup">+ Group</button></div>
      <div id="addPaneBtns" class="row" style="margin-top:12px; gap:6px; display:none"><button class="primary" id="addPane">+ Pane</button></div>
    </div>
    <div id="colsplit" class="colsplit" title="Drag to resize"></div>
    <div class="col editor">
      <div id="gridmeta"></div>
      <div id="tilegrid" class="tilegrid"></div>
      <div id="mergebar" class="mergebar"></div>
      <div class="panes">
        <div id="tileform"></div>
        <div id="iconpane"></div>
      </div>
      <div id="pagedanger"></div>
    </div>
  </div>
  <footer>
    <span id="state" class="state"></span>
    <button class="primary" id="saveBtn" disabled>Save &amp; apply</button>
  </footer>
<script src="configMerge.js"></script>
<script src="config.js"></script>
</body>
</html>
