<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Assistant</title>
  <link rel="stylesheet" href="style.css?v=1.0.6">
</head>
<body>
  <main class="deck" id="deck">
    <section class="zone zone-art" aria-label="Album art">
      <div class="cover" id="cover"><span class="ph" id="cover-ph">♪</span></div>
      <div class="pillrow">
        <div class="status-pill" id="status-pill" role="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">Connecting</span>
        </div>
      </div>
    </section>

    <section class="zone zone-center" aria-label="Now playing">
      <div class="meta">
        <div class="title-line">
          <h1 class="track-title" id="track-title">&nbsp;</h1>
          <button class="fav-btn ic" id="fav-btn" type="button" aria-label="Add current track to favorites" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C7 16.5 3 13.3 3 9.4 3 6.9 5 5 7.5 5c1.7 0 3.3.9 4.5 2.4C13.2 5.9 14.8 5 16.5 5 19 5 21 6.9 21 9.4c0 3.9-4 7.1-9 11.6Z"></path></svg>
          </button>
        </div>
        <div class="track-artist" id="track-artist"></div>
        <div class="track-album" id="track-album"></div>
        <div class="idle-strip" id="idle-strip"></div>
      </div>

      <div class="scrub">
        <div class="scrub-hit" id="scrub-hit">
          <div class="bar-track unknown" id="progress-track" role="progressbar" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <i class="bar-fill" id="progress-fill"></i>
          </div>
        </div>
        <div class="times">
          <span id="elapsed">--:--</span>
          <span id="duration">--:--</span>
        </div>
      </div>

      <div class="transport" id="transport">
        <button class="tbtn small ic" id="shuffle-btn" type="button" aria-label="Toggle shuffle" data-cmd="shuffle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="M4 4l5 5"></path></svg>
        </button>
        <button class="tbtn mid ic" type="button" aria-label="Previous track" data-cmd="previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20 9 12l10-8v16Z"></path><path d="M5 19V5"></path></svg>
        </button>
        <button class="tbtn play ic" id="play-btn" type="button" aria-label="Play or pause" data-cmd="play_pause">
          <svg class="main" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"></path></svg>
          <svg class="alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>
        </button>
        <button class="tbtn mid ic" type="button" aria-label="Next track" data-cmd="next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 10 8-10 8V4Z"></path><path d="M19 5v14"></path></svg>
        </button>
        <button class="tbtn small ic" id="repeat-btn" type="button" aria-label="Cycle repeat mode" data-cmd="repeat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2v4H7a4 4 0 0 0-4 4v1"></path><path d="m17 2 3 3-3 3"></path><path d="M7 22v-4h10a4 4 0 0 0 4-4v-1"></path><path d="m7 22-3-3 3-3"></path></svg>
          <span class="mode-badge" id="repeat-badge" hidden>1</span>
        </button>
      </div>

      <div class="volrow" id="volrow">
        <button class="vbtn mute ic" id="mute-btn" type="button" aria-label="Toggle mute">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a8.5 8.5 0 0 1 0 12"></path></svg>
        </button>
        <button class="vbtn" id="vol-down" type="button" aria-label="Volume down">−</button>
        <div class="vslider unknown" id="vol-slider">
          <div class="bar-track"><i class="bar-fill" id="vol-fill"></i></div>
          <div class="vthumb" id="vol-thumb"></div>
        </div>
        <button class="vbtn" id="vol-up" type="button" aria-label="Volume up">+</button>
      </div>
    </section>

    <section class="zone zone-queue" aria-label="Queue">
      <div class="rail-head">
        <span class="eyebrow">Queue</span>
        <span class="rail-count" id="queue-count"></span>
        <button class="chip" id="dstm-btn" type="button" aria-label="Toggle Don't Stop The Music" aria-pressed="false">∞ Auto</button>
        <button class="sq-btn ic" id="queue-menu-btn" type="button" aria-label="Queue actions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
        </button>
      </div>
      <div class="qwrap">
        <div class="qlist" id="queue-list"></div>
        <div class="sbar" id="queue-sbar"><div class="sbar-thumb" id="queue-sbar-thumb"></div></div>
      </div>
      <div class="rail-empty" id="queue-empty" hidden>Queue is empty —<br>browse the library</div>
    </section>

    <section class="zone zone-players" aria-label="Players">
      <div class="rail-head">
        <span class="eyebrow">Players</span>
        <span class="rail-count"></span>
        <button class="sq-btn ic" id="group-btn" type="button" aria-label="Group players">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
        </button>
      </div>
      <button class="pcur" id="player-current" type="button" aria-label="Current player">
        <div class="pname" id="pcur-name">—</div>
        <div class="pstate" id="pcur-state"></div>
      </button>
      <div class="plist" id="player-list"></div>
      <div class="pbot">
        <button class="big-btn ic" id="library-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"></path><path d="M9 19V5"></path><path d="m13 6 6-1.5v13L13 19V6Z"></path></svg>
          <span class="lbl">Library</span>
        </button>
        <button class="big-btn ic" id="search-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <span class="lbl">Search</span>
        </button>
      </div>
    </section>
  </main>

  <div class="state-card" id="state-card" hidden>
    <h2 id="state-title"></h2>
    <div id="state-body"></div>
  </div>

  <button class="backdrop" id="backdrop" type="button" aria-label="Close" hidden></button>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Library" aria-hidden="true" inert>
    <nav class="tab-rail" id="tab-rail">
      <button class="tab" type="button" data-tab="home">Home</button>
      <button class="tab" type="button" data-tab="artists">Artists</button>
      <button class="tab" type="button" data-tab="albums">Albums</button>
      <button class="tab" type="button" data-tab="tracks">Tracks</button>
      <button class="tab" type="button" data-tab="playlists">Playlists</button>
      <button class="tab" type="button" data-tab="radios">Radio</button>
      <button class="tab" type="button" data-tab="search">Search</button>
    </nav>
    <div class="drawer-content">
      <div class="drawer-head">
        <button class="back-btn" id="drawer-back" type="button" hidden>‹ Back</button>
        <span class="drawer-title" id="drawer-title">Library</span>
        <span class="drawer-count" id="drawer-count"></span>
        <button class="close-btn ic" id="drawer-close" type="button" aria-label="Close library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </aside>

  <aside class="gpanel" id="gpanel" role="dialog" aria-modal="true" aria-label="Group players" aria-hidden="true" inert>
    <div class="ghead">
      <span class="drawer-title">Group players</span>
      <button class="close-btn ic" id="gpanel-close" type="button" aria-label="Close grouping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div class="grow-master" id="gmaster" hidden>
      <span class="gname">Group volume</span>
      <div class="vslider" id="gvol-slider" data-role="group">
        <div class="bar-track"><i class="bar-fill"></i></div>
        <div class="vthumb"></div>
      </div>
      <button class="gmute ic" id="gvol-mute" type="button" aria-label="Mute group">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="m16 9 5 6M21 9l-5 6"></path></svg>
      </button>
    </div>
    <div class="glist" id="glist"></div>
    <div class="gfoot">
      <button class="done-btn" id="gpanel-done" type="button">Done</button>
    </div>
  </aside>

  <div class="ctx" id="ctx" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="touchDragScroll.js?v=1.0.6"></script>
  <script src="ma-client.js?v=1.0.6"></script>
  <script src="mock.js?v=1.0.6"></script>
  <script src="library.js?v=1.0.6"></script>
  <script src="app.js?v=1.0.6"></script>
</body>
</html>
